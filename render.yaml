# Blueprint para Render (render.com): New + > Blueprint > elegir este repositorio.
services:
  - type: web
    name: hrms
    runtime: python
    plan: starter            # el disco persistente requiere un plan pago
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi --workers 3 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
      - key: HRMS_ADMIN_USER
        sync: false
      - key: HRMS_ADMIN_PASSWORD
        sync: false
    disk:
      name: hrms-media
      mountPath: /var/data
      sizeGB: 5
databases:
  - name: hrms-db
    plan: basic-256mb
