{% extends "base.html" %}
{% block title %}Eliminar{% endblock %}
{% block content %}
<div class="card" style="max-width:560px"><div class="card-body">
  <h1 class="h5"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Confirmar eliminación</h1>
  <p>¿Seguro que querés eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Eliminar</button>
    <a href="{{ cancel_url }}" class="btn btn-link">Cancelar</a>
  </form>
</div></div>
{% endblock %}
