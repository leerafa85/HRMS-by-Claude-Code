{% extends "base.html" %}
{% block title %}Reportes{% endblock %}
{% block content %}
<h1 class="h4 page-title mb-3">Reportes de RRHH</h1>
<div class="row g-3">{% for r in reports %}<div class="col-md-6 col-xl-4"><a href="{% url 'reportes:report' r.slug %}" class="card h-100 text-decoration-none text-body"><div class="card-body"><h2 class="h6"><i class="bi bi-bar-chart text-primary me-1"></i>{{ r.title }}</h2><p class="small text-muted mb-0">{{ r.desc }}</p></div></a></div>{% empty %}<p class="text-muted">No tenés reportes disponibles.</p>{% endfor %}</div>
{% endblock %}
