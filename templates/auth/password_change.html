{% extends "base.html" %}{% load hrms %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="card" style="max-width:520px"><div class="card-body">
  <h1 class="h5 mb-3">Cambiar contraseña</h1>
  <form method="post">{% csrf_token %}{% include "partials/form_errors.html" %}
    <div class="row">{% for f in form %}{% field f "col-12" %}{% endfor %}</div>
    <button class="btn btn-primary">Guardar</button> <a href="{% url 'dashboard' %}" class="btn btn-link">Cancelar</a>
  </form>
</div></div>
{% endblock %}
