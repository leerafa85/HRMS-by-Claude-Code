{% load hrms %}
{% if is_paginated %}
<nav class="mt-3"><ul class="pagination pagination-sm justify-content-end mb-0">
  {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{% qs_replace page=page_obj.previous_page_number %}">‹</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} registros</span></li>
  {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{% qs_replace page=page_obj.next_page_number %}">›</a></li>{% endif %}
</ul></nav>
{% endif %}
